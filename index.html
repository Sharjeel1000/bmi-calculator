<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>BMI Calculator</h1>
        <p class="subtitle">Calculate your Body Mass Index</p>

        <div class="input-group">
            <label for="height">Height (cm)</label>
            <input type="number" id="height" placeholder="e.g. 165">
        </div>

        <div class="input-group">
            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" placeholder="e.g. 60">
        </div>

        <button onclick="calculateBMI()">Calculate BMI</button>

        <div id="result" class="result">
            <h2 id="bmiValue">--</h2>
            <p id="category">Enter your details above</p>
        </div>

        <p class="note">
            BMI is a screening tool, not a medical diagnosis.
            Adult categories are intended for ages 20 and older.
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
